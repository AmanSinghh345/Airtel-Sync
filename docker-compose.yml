services:
  postgres:
    image: postgres:16-alpine
    container_name: udyamone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-udyamone_db}
      POSTGRES_USER: ${POSTGRES_USER:-udyamone_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-udyamone_secret_2026}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - udyamone_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-udyamone_user} -d ${POSTGRES_DB:-udyamone_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  udyamone_pgdata:
    name: udyamone_pgdata
